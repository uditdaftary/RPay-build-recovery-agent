<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Recovery agent{% endblock %}</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #fbfbfa;
    --border: #e4e4e2;
    --text: #1a1a19;
    --muted: #6b6b67;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --danger: #a3341f;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131313;
      --surface: #1a1a1a;
      --border: #2c2c2c;
      --text: #ededec;
      --muted: #9a9a96;
      --accent: #4b8ef7;
      --danger: #e5735a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
  }
  .amount { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 10px 0 2px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 14px; }
  .row + .row { border-top: 1px solid var(--border); }
  .chip {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2px 7px;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
  }
  button, .btn {
    font: inherit;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 9px 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    width: 100%;
    font-weight: 500;
    padding: 11px 14px;
  }
  button.primary:hover { opacity: 0.92; }
  button[disabled] { opacity: 0.5; cursor: default; }
  input, textarea, select {
    font: inherit;
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
  }
  textarea { min-height: 74px; resize: vertical; }
  details { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }
  details + details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 500; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+ "; color: var(--muted); }
  details[open] summary::before { content: "- "; }
  details > div { padding-top: 12px; }
  .status { padding: 10px 12px; border-radius: var(--radius); font-size: 14px; margin-top: 12px; }
  .status.ok { background: rgba(31, 111, 235, 0.09); border: 1px solid var(--accent); }
  .status.err { background: rgba(163, 52, 31, 0.09); border: 1px solid var(--danger); color: var(--danger); }
  a { color: var(--accent); }
  ul { padding-left: 18px; margin: 0; }
  li { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
